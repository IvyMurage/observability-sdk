apiVersion: 1

contactPoints:
  - orgId: 1
    name: microsoft-teams
    receivers:
      - uid: teams-webhook
        type: teams
        settings:
          url: https://your-teams-webhook-url-here
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: microsoft-teams
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: Log Alerts
    folder: Observability
    interval: 1m
    rules:
      - uid: error-log-spike
        title: Error Log Spike
        condition: C
        noDataState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(rate({level="error"} |= "" [5m]))'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.5
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Error log rate exceeds 0.5/sec across services

      - uid: auth-failure-spike
        title: Authentication Failure Spike
        condition: C
        noDataState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(rate({level="warn"} |~ "authentication_failed" [5m]))'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 1
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Authentication failures exceed 1/sec — possible brute force

      - uid: no-logs-from-service
        title: Service Stopped Logging
        condition: C
        noDataState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              expr: 'count_over_time({service_name=~".+"} [10m])'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
              refId: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: No logs received from any service for 10 minutes
